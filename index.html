<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f0c0a">
  <title>Atouts — Tarot Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Setup Screen -->
  <div class="setup-screen" id="setup-screen">
    <div class="setup-content">
      <div class="header-ornament"></div>
      <h1>Joueurs</h1>
      <p class="subtitle">Avant de commencer</p>
      
      <div class="player-count">
        <button class="count-btn" data-count="3">3</button>
        <button class="count-btn active" data-count="4">4</button>
        <button class="count-btn" data-count="5">5</button>
      </div>
      
      <div class="names-inputs" id="names-inputs">
        <!-- Generated -->
      </div>
      
      <button class="start-btn" id="start-btn">Commencer la partie</button>
    </div>
  </div>

  <!-- Main App -->
  <div class="app" id="app" hidden>
    <header class="header">
      <div class="header-ornament"></div>
      <h1>Atouts</h1>
      <p class="subtitle">Tracker de jeu</p>
    </header>

    <div class="stats">
      <div class="stat">
        <span class="stat-value" id="fallen-count">0</span>
        <span class="stat-label">tombés</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-value" id="remaining-count">22</span>
        <span class="stat-label">restants</span>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <h2 class="section-title">Restants</h2>
    <main class="grid" id="grid">
      <!-- Remaining cards -->
    </main>

    <div id="players-sections">
      <!-- Player groups generated -->
    </div>

    <footer class="footer">
      <button class="reset-btn" id="reset-btn" type="button">
        <span class="reset-icon">↺</span>
        Réinitialiser
      </button>
    </footer>
  </div>

  <!-- Player selection overlay -->
  <div class="select-overlay" id="select-overlay" hidden>
    <div class="select-panel">
      <h3>Qui a joué ?</h3>
      <div class="player-chips" id="player-chips">
        <!-- Chips -->
      </div>
      <button class="cancel-select" id="cancel-select">Annuler</button>
    </div>
  </div>

  <!-- Confirmation modal -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal">
      <h2>Réinitialiser ?</h2>
      <p>Tous les atouts reviendront dans la liste principale. Les joueurs sont conservés.</p>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="modal-cancel" type="button">Annuler</button>
        <button class="modal-btn confirm" id="modal-confirm" type="button">Confirmer</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
